  sections:
    Profile:
      - Security professional with 4+ years of combined experience across penetration testing, quality assurance, IT support, application security, Active Directory, and vulnerability research. Skilled in identifying and validating security flaws through manual testing, automated tooling, and independent bug bounty research, and in translating findings into clear, actionable reports for technical and non-technical stakeholders. Active in the offensive security community as a CTF competitor, team captain, and mentor, with hands-on lab experience across TryHackMe, HackTheBox, and PortSwigger Web Security Academy, including Active Directory attack paths.

    Experience:
      - company: Stella Ops
        position: Penetration Tester
        location: Remote
        start_date: 2023
        end_date: 2025
        highlights:
          - Performed web and mobile application security testing using manual and automated techniques across authentication, session management, and input validation layers.
          - Identified and validated vulnerabilities including authentication flaws, injection issues, business logic weaknesses, and security misconfigurations.
          - Produced detailed technical reports with proof-of-concept steps, CVSS-aligned severity ratings, and remediation guidance for engineering and non-technical stakeholders.
          - Partnered with development teams throughout the remediation lifecycle, advising on secure coding practices and validating fixes before closure.
          - Applied risk-based prioritization to findings, helping teams focus remediation effort on the highest-impact vulnerabilities first.

      - company: UPGRADED ERA
        position: Quality Assurance
        location: Port Harcourt, Nigeria
        start_date: 2021
        end_date: 2023
        highlights:
          - Conducted functional and security-focused testing on MyMTN mobile and web applications to ensure reliability, usability, and resilience against common defects.
          - Identified and documented application defects and vulnerabilities with detailed, reproducible steps for engineering triage.
          - Collaborated with development teams to troubleshoot issues, verify fixes, and improve overall application stability.
          - Performed usability testing and analyzed user feedback to inform product and system quality improvements.

      - company: LOCTECH NG
        position: IT Support Intern
        location: Port Harcourt, Nigeria
        start_date: 2015
        end_date: 2017
        highlights:
          - Delivered first-line technical support for hardware, software, and networking issues across the organization.
          - Installed, configured, and maintained workstations, system updates, and business applications for end users.
          - Diagnosed system and connectivity problems using tools such as Firebug and Chrome DevTools to identify web application errors.

    Security Research & Projects:
