          - Assessed Active Directory and Microsoft Entra ID configurations for weak authentication controls, excessive user permissions, and misconfigurations using BloodHound and Impacket.
          - Hands-on practice across TryHackMe, HackTheBox, and PortSwigger Web Security Academy.

