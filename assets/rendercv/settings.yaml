# RenderCV output settings
# See https://docs.rendercv.com/user_guide/yaml_input_structure/settings/
settings:
  render_command:
    # Paths are relative to _data/cv.yaml
    design: ../assets/rendercv/design.yaml
    locale: ../assets/rendercv/locale.yaml
    typst_path: ../assets/rendercv/rendercv_output/Chuks_Clinton_Cybersecurity_CV.typ
    pdf_path: ../assets/rendercv/rendercv_output/Chuks_Clinton_Cybersecurity_CV.pdf
    markdown_path: ../assets/rendercv/rendercv_output/Chuks_Clinton_Cybersecurity_CV.md
    html_path: ../assets/rendercv/rendercv_output/Chuks_Clinton_Cybersecurity_CV.html
    png_path: ../assets/rendercv/rendercv_output/Chuks_Clinton_Cybersecurity_CV.png
    dont_generate_markdown: true
    dont_generate_html: true
    dont_generate_typst: false
    dont_generate_pdf: false
    dont_generate_png: true
  bold_keywords:
    - Penetration Testing
    - Web Application Security
    - API Security
    - Burp Suite
    - Nmap
    - Python
